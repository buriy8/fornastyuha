<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Для Настюшки ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Georgia', serif;
            height: 100vh;
        }

        /* ===== СТАРТОВЫЙ ЭКРАН ===== */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0010 0%, #000000 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, transform 1s ease;
        }
        #startScreen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        /* Маленькие сердечки на фоне */
        .bg-heart {
            position: absolute;
            color: #ff6b9d;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .title {
            font-size: 48px;
            color: #ff6b9d;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
            animation: pulse 2s ease-in-out infinite;
            z-index: 1;
        }

        .subtitle {
            font-size: 20px;
            color: #ff9dbf;
            margin-bottom: 50px;
            opacity: 0.8;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #startBtn {
            padding: 20px 60px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            box-shadow: 0 5px 30px rgba(255, 107, 157, 0.5);
            transition: all 0.3s;
            z-index: 1;
            letter-spacing: 2px;
        }
        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(255, 107, 157, 0.8);
        }
        #startBtn:active {
            transform: scale(0.95);
        }

        /* ===== ЭКРАН АНИМАЦИИ ===== */
        #animationScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #animationScreen.visible {
            opacity: 1;
        }

        canvas {
            display: block;
        }

        /* Индикатор музыки */
        #musicInfo {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ff6b9d;
            font-size: 14px;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 100;
        }
        #musicInfo.show {
            opacity: 1;
        }

        /* Кнопка управления музыкой */
        #musicToggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 107, 157, 0.2);
            border: 1px solid #ff6b9d;
            color: #ff6b9d;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 100;
        }
        #musicToggle.show {
            opacity: 1;
        }
        #musicToggle:hover {
            background: rgba(255, 107, 157, 0.4);
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="startScreen">
        <div class="title">💝</div>
        <div class="title" style="font-size: 36px;">Для Настюшки</div>
        <div class="subtitle">жми...</div>
        <button id="startBtn">click ❤️</button>
    </div>

    <!-- ЭКРАН АНИМАЦИИ -->
    <div id="animationScreen">
        <canvas id="heartCanvas"></canvas>
        <div id="musicInfo">🎵 Music Playing 🎵</div>
        <button id="musicToggle">🔊 Музыка</button>
    </div>

    <!-- АУДИО -->
    <audio id="music" loop>
        <source src="https://github.com/buriy8/fornastyuha/blob/main/heart.html" type="audio/mpeg">
    </audio>

    <script>
        const startScreen = document.getElementById('startScreen');
        const animationScreen = document.getElementById('animationScreen');
        const startBtn = document.getElementById('startBtn');
        const music = document.getElementById('music');
        const musicInfo = document.getElementById('musicInfo');
        const musicToggle = document.getElementById('musicToggle');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Создаём фоновые сердечки на стартовом экране
        function createBgHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '💝'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                startScreen.appendChild(heart);
            }
        }
        createBgHearts();

        // Размер canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let angle = 0;
        const text = "i love you";
        const numTexts = 70;
        const scale = 25;

        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }
        function heartY(t) {
            return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.font = 'bold 28px Georgia';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < numTexts; i++) {
                const t = (i / numTexts) * Math.PI * 2 + angle;
                const x = heartX(t) * scale + centerX;
                const y = heartY(t) * scale + centerY;

                const hue = 340 + (i / numTexts) * 30;
                ctx.fillStyle = `hsla(${hue}, 90%, 60%, 1)`;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;
                ctx.shadowBlur = 15;

                ctx.fillText(text, x, y);
            }

            ctx.shadowBlur = 0;
            angle += 0.005;
            requestAnimationFrame(animate);
        }

        // ===== ГЛАВНОЕ: КЛИК ПО КНОПКЕ =====
        startBtn.addEventListener('click', function() {
            // 1. Запускаем музыку
            music.play().then(() => {
                musicInfo.classList.add('show');
                musicToggle.classList.add('show');
            }).catch(err => {
                console.log('Музыка не загрузилась:', err);
            });

            // 2. Скрываем стартовый экран
            startScreen.classList.add('hidden');

            // 3. Показываем экран анимации
            setTimeout(() => {
                animationScreen.classList.add('visible');
                animate();
            }, 500);
        });

        // Кнопка вкл/выкл музыки
        musicToggle.addEventListener('click', function() {
            if (music.paused) {
                music.play();
                musicToggle.textContent = '🔊 Музыка';
            } else {
                music.pause();
                musicToggle.textContent = ' Музыка';
            }
        });
    </script>
</body>
</html>

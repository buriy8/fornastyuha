<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️ Для Настюшки ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Georgia', serif;
            height: 100vh;
            width: 100vw;
        }

        /* ===== СТАРТОВЫЙ ЭКРАН ===== */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0010 0%, #000000 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, transform 1s ease;
        }
        #startScreen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            color: #ff6b9d;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .title {
            font-size: 48px;
            color: #ff6b9d;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
            animation: pulse 2s ease-in-out infinite;
            z-index: 1;
        }

        .subtitle {
            font-size: 20px;
            color: #ff9dbf;
            margin-bottom: 50px;
            opacity: 0.8;
            z-index: 1;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #startBtn {
            padding: 20px 60px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            box-shadow: 0 5px 30px rgba(255, 107, 157, 0.5);
            transition: all 0.3s;
            z-index: 1;
            letter-spacing: 2px;
        }
        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(255, 107, 157, 0.8);
        }
        #startBtn:active {
            transform: scale(0.95);
        }

        /* ===== ЭКРАН АНИМАЦИИ ===== */
        #animationScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #animationScreen.visible {
            opacity: 1;
        }

        canvas {
            display: block;
        }

        /* ===== АДАПТИВ ДЛЯ ТЕЛЕФОНОВ ===== */
        @media (max-width: 768px) {
            .title {
                font-size: 32px;
            }
            .title[style*="font-size: 36px"] {
                font-size: 24px !important;
            }
            .subtitle {
                font-size: 16px;
                margin-bottom: 30px;
            }
            #startBtn {
                padding: 15px 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <div class="title">💝</div>
        <div class="title" style="font-size: 36px;">Для Настюшки</div>
        <div class="subtitle">жми жми</div>
        <button id="startBtn">start</button>
    </div>

    <div id="animationScreen">
        <canvas id="heartCanvas"></canvas>
    </div>

    <audio id="music" loop preload="auto">
        <source src="ily.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startScreen = document.getElementById('startScreen');
        const animationScreen = document.getElementById('animationScreen');
        const startBtn = document.getElementById('startBtn');
        const music = document.getElementById('music');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function createBgHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '💝'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                startScreen.appendChild(heart);
            }
        }
        createBgHearts();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let angle = 0;
        const text = "i love you";
        
        // АДАПТИВНЫЕ РАЗМЕРЫ
        const isMobile = window.innerWidth <= 768;
        const numTexts = isMobile ? 50 : 70;
        const scale = isMobile ? 12 : 25;
        const fontSize = isMobile ? '18px' : '28px';

        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }
        function heartY(t) {
            return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2.2;

            ctx.font = `bold ${fontSize} Georgia`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < numTexts; i++) {
                const t = (i / numTexts) * Math.PI * 2 + angle;
                const x = heartX(t) * scale + centerX;
                const y = heartY(t) * scale + centerY;

                const hue = 340 + (i / numTexts) * 30;
                ctx.fillStyle = `hsla(${hue}, 90%, 60%, 1)`;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;
                ctx.shadowBlur = 15;

                ctx.fillText(text, x, y);
            }

            ctx.shadowBlur = 0;
            angle += 0.004;
            requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', function() {
            music.play().catch(err => {
                console.log('Музыка не загрузилась:', err);
            });

            startScreen.classList.add('hidden');

            setTimeout(() => {
                animationScreen.classList.add('visible');
                animate();
            }, 500);
        });
    </script>
</body>
</html>

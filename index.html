<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️ Для Настюшки ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Georgia', serif;
            height: 100vh;
            width: 100vw;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0000 0%, #000000 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease, transform 1s ease;
        }
        #startScreen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            color: #ff0000;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .title {
            font-size: 48px;
            color: #ff0000;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
            z-index: 1;
        }

        .subtitle {
            font-size: 20px;
            color: #ff4444;
            margin-bottom: 50px;
            opacity: 0.8;
            z-index: 1;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #startBtn {
            padding: 20px 60px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            box-shadow: 0 5px 30px rgba(255, 0, 0, 0.5);
            transition: all 0.3s;
            z-index: 1;
            letter-spacing: 2px;
        }
        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(255, 0, 0, 0.8);
        }
        #startBtn:active {
            transform: scale(0.95);
        }

        #animationScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #animationScreen.visible {
            opacity: 1;
        }

        canvas {
            display: block;
        }

        #timer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0000;
            font-size: 18px;
            text-align: center;
            z-index: 100;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 1s ease;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        #timer.show {
            opacity: 1;
        }
        #timer .label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        #timer .time {
            font-size: 20px;
            font-weight: bold;
        }

        .reason {
            position: fixed;
            color: #ff0000;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            animation: fadeInReason 2s ease forwards;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
            max-width: 200px;
            text-align: center;
            z-index: 50;
        }
        @keyframes fadeInReason {
            to {
                opacity: 0.25;
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 32px;
            }
            .title[style*="font-size: 36px"] {
                font-size: 24px !important;
            }
            .subtitle {
                font-size: 16px;
                margin-bottom: 30px;
            }
            #startBtn {
                padding: 15px 40px;
                font-size: 18px;
            }
            #timer {
                font-size: 12px;
                padding: 8px 15px;
                bottom: 10px;
            }
            #timer .label {
                font-size: 11px;
            }
            #timer .time {
                font-size: 14px;
            }
            .reason {
                font-size: 11px;
                max-width: 150px;
            }
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <div class="title">💝</div>
        <div class="title" style="font-size: 36px;">Для Настюшки</div>
        <div class="subtitle">жми</div>
        <button id="startBtn">click</button>
    </div>

    <div id="animationScreen">
        <canvas id="heartCanvas"></canvas>
        <div id="timer">
            <div class="label">Вместе уже:</div>
            <div class="time" id="timeDisplay">0 дней 0 часов 0 минут 0 секунд</div>
        </div>
    </div>

    <audio id="music" loop preload="auto">
        <source src="ily.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startScreen = document.getElementById('startScreen');
        const animationScreen = document.getElementById('animationScreen');
        const startBtn = document.getElementById('startBtn');
        const music = document.getElementById('music');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const timer = document.getElementById('timer');
        const timeDisplay = document.getElementById('timeDisplay');

        const reasons = [
            "Твоя улыбка", "Твои глаза", "Твой смех", "Твоя доброта",
            "Ты всегда рядом", "Твоя поддержка", "Твои объятия", "Твой голос",
            "Ты понимаешь меня", "Твоя нежность", "Твоя забота", "Ты делаешь меня счастливым",
            "Твоя красота", "Твой ум", "Твоя душа", "Ты моя мечта",
            "Ты вдохновляешь меня", "Ты моя сила", "Ты мой смысл", "Ты мой мир",
            "Твои прикосновения", "Твой аромат", "Твоя искренность", "Твоя верность",
            "Ты принимаешь меня", "Ты веришь в меня", "Ты мой лучший друг", "Ты моя любовь",
            "Ты моя судьба", "Ты моё счастье", "Ты моё всё", "Ты уникальна",
            "Ты особенная", "Ты прекрасна", "Ты совершенна", "Ты невероятная",
            "Ты волшебная", "Ты ангел", "Ты звезда", "Ты солнце",
            "Ты луна", "Ты космос", "Ты вечность", "Ты бесконечность",
            "Ты жизнь", "Ты дыхание", "Ты сердце", "Ты любовь",
            "Ты Настя", "Ты моя"
        ];

        function createBgHearts() {
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '💝'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                startScreen.appendChild(heart);
            }
        }
        createBgHearts();

        function createReasons() {
            reasons.forEach((reason, index) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'reason';
                    div.textContent = reason;
                    div.style.left = Math.random() * 80 + 10 + '%';
                    div.style.top = Math.random() * 80 + 10 + '%';
                    div.style.animationDelay = (Math.random() * 2) + 's';
                    animationScreen.appendChild(div);
                }, index * 100);
            });
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const text = "i love you";
        const isMobile = window.innerWidth <= 768;
        const scale = isMobile ? 10 : 22;
        const fontSize = isMobile ? '11px' : '16px';

        // Параметрические уравнения сердца
        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }
        function heartY(t) {
            return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        }

        // Проверка: точка внутри сердца?
        function isInsideHeart(x, y) {
            // Преобразуем в параметрические координаты
            const nx = x / 16;
            const ny = y / 13;
            // Используем неявное уравнение сердца
            return Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx * Math.pow(ny, 3) <= 0.5;
        }

        let placedTexts = [];
        let angle = 0;

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2.2;

            ctx.font = `bold ${fontSize} Georgia`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Рисуем контур сердца (вращающийся)
            const numPoints = isMobile ? 50 : 70;
            for (let i = 0; i < numPoints; i++) {
                const t = (i / numPoints) * Math.PI * 2 + angle;
                const x = heartX(t) * scale + centerX;
                const y = heartY(t) * scale + centerY;

                ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
                ctx.shadowColor = 'rgba(255, 0, 0, 0.8)';
                ctx.shadowBlur = 10;
                ctx.fillText(text, x, y);
            }

            // Добавляем текст ВНУТРИ сердца
            if (placedTexts.length < 100) {
                for (let attempt = 0; attempt < 20; attempt++) {
                    // Генерируем случайную точку в bounding box сердца
                    const rx = (Math.random() - 0.5) * 32 * scale;
                    const ry = (Math.random() - 0.5) * 26 * scale;
                    
                    // Проверяем внутри ли
                    if (isInsideHeart(rx / scale, ry / scale)) {
                        // Проверяем расстояние до других точек
                        let tooClose = false;
                        for (let pt of placedTexts) {
                            const dx = rx - (pt.x - centerX);
                            const dy = ry - (pt.y - centerY);
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < (isMobile ? 25 : 35)) {
                                tooClose = true;
                                break;
                            }
                        }
                        
                        if (!tooClose) {
                            placedTexts.push({
                                x: rx + centerX,
                                y: ry + centerY,
                                opacity: 0,
                                targetOpacity: 0.4 + Math.random() * 0.3
                            });
                            break;
                        }
                    }
                }
            }

            // Рисуем все точки внутри
            placedTexts.forEach((pt) => {
                if (pt.opacity < pt.targetOpacity) {
                    pt.opacity += 0.01;
                }
                
                const flicker = 0.95 + Math.sin(Date.now() * 0.002 + pt.x) * 0.05;
                ctx.fillStyle = `rgba(255, 0, 0, ${pt.opacity * flicker})`;
                ctx.shadowBlur = 5;
                ctx.fillText(text, pt.x, pt.y);
            });

            ctx.shadowBlur = 0;
            angle += 0.003;
            requestAnimationFrame(animate);
        }

        const startDate = new Date('2025-10-19T00:00:00');
        
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            timeDisplay.textContent = `${days}д ${hours}ч ${minutes}м ${seconds}с`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        startBtn.addEventListener('click', function() {
            music.play().catch(err => {
                console.log('Музыка не загрузилась:', err);
            });

            startScreen.classList.add('hidden');

            setTimeout(() => {
                animationScreen.classList.add('visible');
                timer.classList.add('show');
                createReasons();
                animate();
            }, 500);
        });
    </script>
</body>
</html>
